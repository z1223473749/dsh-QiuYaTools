name: Build and release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-native:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Verify the tagged source before building
        run: node scripts/release-source-guard.mjs --before-build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - run: npm ci
      - name: Build self-contained Windows ARM64 and x64 helpers
        run: node scripts/build-windows-native.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-native
          path: lib/native/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: windows-native
    runs-on: macos-15
    outputs:
      stable: ${{ steps.version.outputs.stable }}
    permissions:
      contents: write
    env:
      QIUYA_TOOLS_UNIVERSAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Validate version and tag
        id: version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json"));
            if (process.env.GITHUB_REF !== `refs/tags/v${version}`) throw new Error("Run this workflow from the matching v<package version> tag");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `stable=${!version.includes("-")}\n`);
          '
      - name: Verify the tagged source before building
        run: node scripts/release-source-guard.mjs --before-build
      - run: npm ci
      - name: Read version notes from changelog
        run: node scripts/release-notes.mjs "$RUNNER_TEMP/qiuya-release-notes.md"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Check source and build the universal Mac helpers
        run: QIUYA_DOTNET="$(command -v dotnet)" npm run check
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-native
          path: lib/native/
      - name: Pack and validate all platform release assets
        run: |
          node scripts/prepare-release.mjs
      - name: Verify packed Host without workspace dependencies
        run: node scripts/verify-package.mjs artifacts/dsh-qiuya-tools.tgz
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${{ steps.version.outputs.stable }}" != "true" ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${release_flags[@]}" --title "QiuYa 增强工具箱 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/qiuya-release-notes.md" artifacts/dsh-qiuya-tools.tgz artifacts/dsh-qiuya-tools-darwin-universal.tgz artifacts/dsh-qiuya-tools-win32-arm64.tgz artifacts/dsh-qiuya-tools-win32-x64.tgz artifacts/SHA256SUMS artifacts/release-assets.json

  publish-npm:
    needs: release
    if: >-
      always() && !cancelled() &&
      ((needs.release.result == 'success' && needs.release.outputs.stable == 'true') ||
       (github.event_name == 'release' && github.event.action == 'published' &&
        !github.event.release.draft && !github.event.release.prerelease) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org
      # GITHUB_TOKEN-created releases do not trigger another release workflow.
      # needs.release also publishes in the original successful tag-push run.
      - name: Publish the verified GitHub release archive to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-npm.mjs

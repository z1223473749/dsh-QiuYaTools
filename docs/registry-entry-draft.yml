  en: Adds TXT paste attachments, macOS session windows, batch archiving, plan annotations, menu tools, and next-message suggestions. Suggestions use the current conversation model with extra model usage; Tab inserts, Esc dismisses. Includes an optional illustrated Q theme and individual feature settings.
